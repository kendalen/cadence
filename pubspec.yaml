name: cadence
description: "Offline-first blood pressure diary for Android."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Cupertino icon font. Kept from the default template; may be removed later if
  # the app ships Material-only.
  cupertino_icons: ^1.0.8
  # Persistence engine (CLAUDE.md §2). MIT.
  drift: ^2.34.3
  # A runtime dependency, not a dev one, on purpose: validateDatabaseSchema()
  # ships in drift_dev and CLAUDE.md §5 requires it in beforeOpen under debug.
  # The kDebugMode guard tree-shakes the call out of release builds. drift_dev
  # also generates the database code, the schema snapshots, and the migration
  # test harness. MIT.
  drift_dev: ^2.34.5
  # Flutter bindings for drift: opens the database under
  # getApplicationDocumentsDirectory() and bundles the sqlite3 native library,
  # so path_provider is not needed as a direct dependency here. MIT.
  drift_flutter: ^0.3.1
  # Value equality for the immutable domain entities. MIT.
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  # State management for the whole app: Cubits with constructor-injected
  # dependencies. One approach app-wide (CLAUDE.md §3). MIT.
  flutter_bloc: ^9.1.1
  # Flutter's bundled localisation delegates. Required for the ARB-based i18n
  # scaffolding (CLAUDE.md §9); English is the source locale.
  flutter_localizations:
    sdk: flutter
  # Used by the generated localisations for message and plural formatting.
  intl: any
  # UUID v7 for client-generated, time-ordered entity ids. MIT.
  share_plus: ^13.3.0
  uuid: ^4.6.0

dev_dependencies:
  # Code generation host for drift_dev. BSD-3 (Dart authors).
  build_runner: ^2.16.0
  # Generates the Android launcher icons (all densities + adaptive icon) from
  # the source images in assets/icon. Dev-only: nothing ships in the app. MIT.
  flutter_launcher_icons: ^0.14.4
  # Recommended Flutter lint set; tightened in analysis_options.yaml.
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Launcher icon generation (run: dart run flutter_launcher_icons).
# Source art lives in assets/icon; the C monogram sits on the teal brand tile.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2F6E63"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate localisations from the ARB files in lib/l10n (see l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # SIL Open Font License 1.1 for Hanken Grotesk. Bundled so the licence
    # travels with the font it covers (registered at start-up in main.dart) and
    # shows in the app's "Licenses" page — an OFL redistribution requirement.
    - assets/fonts/OFL.txt

  fonts:
    # Hanken Grotesk (SIL OFL 1.1). One variable-weight file carries every
    # weight; Flutter maps a TextStyle's fontWeight onto its `wght` axis. Bundled
    # as an app asset, NOT via the google_fonts package, which fetches over the
    # network and would break offline-first (CLAUDE.md §2).
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-VariableFont_wght.ttf
