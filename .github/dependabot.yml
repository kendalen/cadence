# Dependabot keeps the GitHub Actions used by the CI workflow up to date.
#
# The actions in .github/workflows/ci.yml are pinned to commit SHAs for
# supply-chain safety; Dependabot opens a PR (gated by CI) whenever a newer
# release exists, updating both the SHA and the trailing version comment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
